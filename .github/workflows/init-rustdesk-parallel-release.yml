name: 检查 RustDesk Parallel 工作流状态

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/init-rustdesk-parallel-release.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: 检查工作流注册状态
    runs-on: ubuntu-latest
    steps:
      - name: 输出 RustDesk Parallel 工作流信息
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows"             --jq '.workflows[] | select(.path | contains("rustdesk-parallel")) | {id,name,path,state}'
