name: 检查 RustDesk Parallel 工作流状态

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/init-rustdesk-parallel-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  inspect:
    name: 检查工作流注册状态
    runs-on: ubuntu-latest
    steps:
      - name: 输出工作流信息并测试已知可用模板
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows"             --jq '.workflows[] | select((.path | contains("rustdesk-parallel")) or (.path | contains("tmp-known-good"))) | {id,name,path,state}'
          echo "---- dispatch tmp-known-good ----"
          gh workflow run tmp-known-good.yml --repo "${{ github.repository }}" --ref master
