name: Auto build and publish RustDesk-B from official release

on:
  push:
    branches:
      - master
    paths:
      - ".github/rustdesk-b-upstream-ref.txt"

permissions:
  actions: read
  contents: write

jobs:
  read-request:
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.request.outputs.upstream_ref }}
      release_tag: ${{ steps.request.outputs.release_tag }}
    steps:
      - name: Checkout automation request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read official RustDesk version
        id: request
        shell: bash
        run: |
          set -euo pipefail
          ref="$(grep -vE '^[[:space:]]*(#|$)' .github/rustdesk-b-upstream-ref.txt | head -n 1 | xargs)"
          if [ -z "$ref" ]; then
            echo "::error::.github/rustdesk-b-upstream-ref.txt does not contain an upstream ref"
            exit 1
          fi
          version="${ref#v}"
          safe_version="$(printf '%s' "$version" | sed -E 's/[^0-9A-Za-z._-]+/-/g')"
          echo "upstream_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=rustdesk-b-$safe_version-unsigned" >> "$GITHUB_OUTPUT"
          echo "Requested official RustDesk ref: $ref"

  build-and-release:
    needs: read-request
    uses: ./.github/workflows/dual-client-windows.yml
    with:
      upstream_ref: ${{ needs.read-request.outputs.upstream_ref }}
      publish_release: true
      sign_release: false
      release_tag: ${{ needs.read-request.outputs.release_tag }}
    secrets: inherit
