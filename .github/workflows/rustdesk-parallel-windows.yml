name: 编译并发布 RustDesk Parallel Windows x64

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "官方 RustDesk 标签、分支或提交（留空则编译当前仓库）"
        required: false
        type: string
        default: ""
      publish_release:
        description: "编译成功后发布到 GitHub Releases"
        required: true
        type: boolean
        default: false
      sign_release:
        description: "发布前使用 Authenticode 对 RustDesk-Parallel.exe 进行签名（当前无证书时请关闭）"
        required: true
        type: boolean
        default: false
      release_tag:
        description: "可选：自定义 Release 标签（留空自动生成）"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      upstream_ref:
        required: false
        type: string
        default: ""
      publish_release:
        required: false
        type: boolean
        default: false
      sign_release:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""
    secrets:
      WINDOWS_SIGN_PFX_BASE64:
        required: false
      WINDOWS_SIGN_PFX_PASSWORD:
        required: false

permissions:
  contents: write

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "-2"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              flutter-arch: x64,
              vcpkg-triplet: x64-windows-static,
              build-args: "--vram",
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Switch to official upstream source
        if: ${{ inputs.upstream_ref != '' }}
        shell: bash
        run: |
          git remote add upstream https://github.com/rustdesk/rustdesk.git || true
          git fetch upstream --tags --force
          ref="${{ inputs.upstream_ref }}"
          if git show-ref --verify --quiet "refs/tags/$ref"; then
            git checkout --detach "refs/tags/$ref"
          elif git show-ref --verify --quiet "refs/tags/v$ref"; then
            git checkout --detach "refs/tags/v$ref"
          else
            git fetch upstream "$ref"
            git checkout --detach FETCH_HEAD
          fi
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "Build source: $(git rev-parse HEAD)"

      - name: 应用 RustDesk Parallel 独立配置补丁
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/core_main.rs")
          text = path.read_text(encoding="utf-8")

          if "set_parallel_profile_from_exe_name" not in text:
              needle = "pub fn core_main() -> Option<Vec<String>> {\\n"
              if needle not in text:
                  raise SystemExit("RustDesk Parallel 补丁失败: core_main() signature not found")

              helper = r'''#[cfg(windows)]
fn set_parallel_profile_from_exe_name() {
    let Ok(exe) = std::env::current_exe() else {
        return;
    };
    let Some(stem) = exe.file_stem().and_then(|x| x.to_str()) else {
        return;
    };
    let stem_lower = stem.to_ascii_lowercase();

    let app_name = if stem_lower == "rustdesk-parallel" || stem_lower.starts_with("rustdesk-parallel-") {
        Some("RustDesk-Parallel")
    } else {
        None
    };

    if let Some(app_name) = app_name {
        *hbb_common::config::APP_NAME.write().unwrap() = app_name.to_owned();
    }
}

'''
              text = text.replace(needle, helper + needle, 1)

              init_needle = """pub fn core_main() -> Option<Vec<String>> {
    if !crate::common::global_init() {
"""
              init_repl = """pub fn core_main() -> Option<Vec<String>> {
    #[cfg(windows)]
    set_parallel_profile_from_exe_name();

    if !crate::common::global_init() {
"""
              if init_needle not in text:
                  raise SystemExit("RustDesk Parallel 补丁失败: global_init anchor not found")
              text = text.replace(init_needle, init_repl, 1)
              path.write_text(text, encoding="utf-8")
          else:
              print("RustDesk Parallel 独立配置补丁已存在")
          '@ | Set-Content -Encoding UTF8 patch_rustdesk_parallel.py
          python patch_rustdesk_parallel.py

      - name: 确定发布版本号
        id: meta
        shell: pwsh
        run: |
          $ref = "${{ inputs.upstream_ref }}"
          if ([string]::IsNullOrWhiteSpace($ref)) {
            $version = "${{ env.VERSION }}"
          } else {
            $version = $ref.Trim()
            if ($version.StartsWith("v")) { $version = $version.Substring(1) }
            $version = $version -replace '[^0-9A-Za-z._-]', '-'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "RustDesk Parallel version: $version"

      - name: 生成 RustDesk Parallel 双开版图标
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          icon = Path("flutter/windows/runner/resources/app_icon.ico")
          im = Image.open(icon)
          im.seek(getattr(im, "n_frames", 1) - 1)
          im = im.convert("RGBA").resize((256, 256), Image.Resampling.LANCZOS)

          draw = ImageDraw.Draw(im)
          # 橙色 P 标记：用于和官方 RustDesk 图标明显区分。
          draw.ellipse((154, 154, 252, 252), fill=(245, 124, 0, 255), outline=(255, 255, 255, 255), width=8)
          try:
              font = ImageFont.truetype(r"C:\Windows\Fonts\arialbd.ttf", 70)
          except Exception:
              font = ImageFont.load_default()
          box = draw.textbbox((0, 0), "P", font=font)
          x = 203 - (box[2] - box[0]) / 2
          y = 201 - (box[3] - box[1]) / 2 - box[1]
          draw.text((x, y), "P", font=font, fill=(255, 255, 255, 255))

          im.save(icon, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 make_parallel_icon.py
          python make_parallel_icon.py

      - name: 写入中文程序说明
        shell: pwsh
        run: |
          $rc = "flutter/windows/runner/Runner.rc"
          $text = Get-Content $rc -Raw -Encoding UTF8
          $text = $text.Replace('VALUE "CompanyName", "Purslane Tech Pte. Ltd." "\0"', 'VALUE "CompanyName", "RustDesk Parallel 自定义构建" "\0"')
          $text = $text.Replace('VALUE "FileDescription", "RustDesk Remote Desktop" "\0"', 'VALUE "FileDescription", "RustDesk 双开版（Parallel）" "\0"')
          $text = $text.Replace('VALUE "InternalName", "rustdesk" "\0"', 'VALUE "InternalName", "RustDesk-Parallel" "\0"')
          $text = $text.Replace('VALUE "LegalCopyright", "Copyright © 2026 Purslane Tech Pte. Ltd. All rights reserved." "\0"', 'VALUE "LegalCopyright", "基于 RustDesk 开源项目的非官方自定义构建" "\0"')
          $text = $text.Replace('VALUE "OriginalFilename", "rustdesk.exe" "\0"', 'VALUE "OriginalFilename", "RustDesk-Parallel.exe" "\0"')
          $text = $text.Replace('VALUE "ProductName", "RustDesk" "\0"', 'VALUE "ProductName", "RustDesk Parallel 双开版" "\0"')
          Set-Content -Path $rc -Value $text -Encoding UTF8
          Write-Host "已写入 RustDesk Parallel 中文程序说明"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225  # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
          architecture: x64

      - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: |
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "Flutter root: $flutterRoot"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
          $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVer
          if ($dartVer -notmatch "windows_arm64") {
            Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
            exit 1
          }
          & "$flutterRoot\bin\flutter.bat" precache --windows
          # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
          # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
          $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
          Write-Host "Engine artifacts present:"
          Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
          if (-not (Test-Path "$engineDir\windows-arm64-release")) {
            Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
            exit 1
          }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
      - name: Replace engine with rustdesk custom flutter engine
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
        if: ${{ matrix.job.arch == 'x86_64' }}
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is the only target on Flutter 3.44; apply its source/pubspec deltas on the fly
        # (shared with the 3.44 bridge job) so the committed sources stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
          mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: true
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
          path: "./rustdesk"

      - name: 生成 RustDesk Parallel 双开版程序
        if: true && matrix.job.arch == 'x86_64'
        run: |
          Move-Item .\rustdesk\rustdesk.exe .\rustdesk\RustDesk-Parallel.exe
          @'
          RustDesk Parallel（双开版）使用说明

          这是基于 RustDesk 开源项目构建的非官方自定义版本，主要用于解决同一台 Windows 电脑同时运行两个相互独立的 RustDesk 客户端的问题。

          使用方式：
          1. 官方 RustDesk 保持原样使用，不需要修改。
          2. 完整解压本压缩包后，运行 RustDesk-Parallel.exe。
          3. RustDesk Parallel 使用独立的配置、登录状态、地址簿和 IPC 空间，不会覆盖官方 RustDesk 的配置。
          4. 请不要只单独复制 RustDesk-Parallel.exe；运行所需的 DLL 和其他文件需要保留在同一目录中。
          5. 当前发布版本为无数字签名版本时，Windows SmartScreen 可能显示安全提醒。

          项目名称：RustDesk Parallel
          中文名称：RustDesk 双开版
          '@ | Set-Content -Path .\rustdesk\使用说明.txt -Encoding UTF8

      - name: 对 RustDesk-Parallel.exe 进行 Authenticode 签名
        if: ${{ inputs.publish_release && inputs.sign_release }}
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_BASE64)) {
            throw "Missing GitHub secret WINDOWS_SIGN_PFX_BASE64"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_PASSWORD)) {
            throw "Missing GitHub secret WINDOWS_SIGN_PFX_PASSWORD"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "rustdesk-parallel-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe was not found on the GitHub-hosted runner"
          }

          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WINDOWS_SIGN_PFX_PASSWORD .\rustdesk\RustDesk-Parallel.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }

          & $signtool verify /pa /v .\rustdesk\RustDesk-Parallel.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }

          $signature = Get-AuthenticodeSignature .\rustdesk\RustDesk-Parallel.exe
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          Write-Host "Status: $($signature.Status)"
          if ($signature.Status -ne "Valid") {
            throw "Authenticode validation failed: $($signature.Status) - $($signature.StatusMessage)"
          }

          Remove-Item $pfxPath -Force

      - name: 打包 Release
        if: ${{ inputs.publish_release }}
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $signed = "${{ inputs.sign_release }}"
          $flavor = if ($signed -eq "true") { "signed" } else { "unsigned" }
          $flavorLabel = if ($signed -eq "true") { "签名版" } else { "无签名版" }

          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "rustdesk-parallel-$version-$flavor"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "flavor=$flavor" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "flavor_label=$flavorLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $zip = "RustDesk-Parallel-$version-Windows-x64-$flavor.zip"
          Compress-Archive -Path .\rustdesk\* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release package: $zip"
          Write-Host "SHA256: $hash"

      - name: 上传 Windows x64 构建产物
        if: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-parallel-windows-x64
          path: rustdesk

      - name: 发布到 GitHub Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: "RustDesk Parallel ${{ steps.meta.outputs.version }} Windows x64（${{ steps.package.outputs.flavor_label }}）"
          prerelease: false
          body: |
            RustDesk Parallel Windows x64 双开版，基于官方 RustDesk 源码版本 `${{ inputs.upstream_ref || 'fork master' }}`.

            - 与官方 RustDesk 使用完全独立的配置、登录状态、地址簿和 IPC 空间
            - 可与官方 RustDesk 同时运行，用于双开
            - 使用带橙色 P 标记的独立图标
            - 构建类型：${{ steps.package.outputs.flavor_label }}
            - 请完整解压 ZIP 后运行 RustDesk-Parallel.exe，不要只单独复制 EXE
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
