name: 自动编译并发布 RustDesk Parallel（跟随官方版本）

on:
  push:
    branches:
      - master
    paths:
      - ".github/rustdesk-parallel-upstream-ref.txt"
      - ".github/workflows/auto-rustdesk-parallel-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: 启动 RustDesk Parallel 编译发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出版本配置
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 检查目标版本并启动编译
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(grep -vE '^[[:space:]]*(#|$)' .github/rustdesk-parallel-upstream-ref.txt | head -n 1 | xargs)"
          if [ -z "$ref" ]; then
            echo "::error::.github/rustdesk-parallel-upstream-ref.txt 中没有目标版本号"
            exit 1
          fi
          echo "当前 RustDesk Parallel 目标版本：$ref"
          gh workflow run rustdesk-parallel-windows.yml             --repo "${{ github.repository }}"             --ref master
